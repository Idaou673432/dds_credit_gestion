    <script>
      window.addEventListener('error', function(event) {
        if (event && event.message && event.message.includes("reading 'send'")) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && event.reason.message && event.reason.message.includes("reading 'send'")) {
          event.preventDefault();
        }
      });
    </script>
