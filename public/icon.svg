<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 8"/>

  <!-- Shield of Trust -->
  <path d="M256 70 L390 130 C390 270, 256 385, 256 425 C256 385, 122 270, 122 130 Z" 
        fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="12" filter="url(#shadow)"/>

  <!-- Handshake & Trust node symbol inside shield -->
  <g transform="translate(146, 150) scale(0.44)">
    <!-- Shield inner glow -->
    <path d="M250 40 L440 120 C440 320, 250 450, 250 480 C250 450, 60 320, 60 120 Z" 
          fill="url(#primaryGrad)" opacity="0.15"/>
    
    <!-- Central Trust Check / Credit Symbol -->
    <!-- Stylized Coin & Checkmark -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#38BDF8" stroke-width="24"/>
    <path d="M190 250 L230 290 L310 200" fill="none" stroke="#2DD4BF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Monogram text DDS -->
  <text x="256" y="365" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">DDS</text>
  <text x="256" y="395" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="6">CONFIANCE</text>
</svg>
